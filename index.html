<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recappy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f7ff;
      --bg-soft: #fff5fd;
      --card: #ffffff;
      --ink: #25304a;
      --muted: #65708f;
      --line: #e4e7f5;
      --brand: #ec4fa0;
      --brand-strong: #d63f8f;
      --accent: #7a6dff;
      --success: #1f9d6b;
      --danger: #cc3c4e;
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --shadow: 0 14px 32px rgba(35, 50, 85, 0.11);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, #ffe6f4 0%, transparent 32%),
        radial-gradient(circle at 92% 6%, #e8e7ff 0%, transparent 28%),
        linear-gradient(170deg, var(--bg) 0%, #f8f9ff 48%, var(--bg-soft) 100%);
      color: var(--ink);
      font-family: "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", sans-serif;
      padding: 18px 12px 34px;
      line-height: 1.55;
    }

    .app {
      width: min(920px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.9fr);
      gap: 14px;
      align-items: center;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.73rem;
      font-weight: 700;
      color: #a22a6d;
      background: #ffe5f3;
      border: 1px solid #ffc6e5;
      letter-spacing: 0.03em;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-family: "Baloo 2", "M PLUS Rounded 1c", sans-serif;
      font-size: clamp(1.55rem, 5vw, 2.15rem);
      line-height: 1.08;
      letter-spacing: 0.01em;
      color: #28334f;
    }

    .hero p {
      margin: 8px 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .character {
      margin: 0;
      background: #faf8ff;
      border: 1px solid #ece3ff;
      border-radius: var(--radius-lg);
      padding: 10px;
    }

    .character img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      background: #efeefd;
      border: 1px solid #e1dff8;
    }

    .character figcaption {
      margin-top: 7px;
      font-size: 0.76rem;
      color: #7a6f9f;
      text-align: center;
    }

    .panel {
      padding: 16px;
    }

    .panel h2 {
      margin: 0;
      font-family: "Baloo 2", "M PLUS Rounded 1c", sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.01em;
    }

    .panel-sub {
      margin: 3px 0 0;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .field {
      margin-top: 13px;
    }

    .field-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .field-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #2a3550;
    }

    .step {
      width: 23px;
      height: 23px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      color: #7c3898;
      background: #f8e9ff;
      border: 1px solid #efcafc;
    }

    textarea {
      width: 100%;
      border: 1px solid #d6dceb;
      border-radius: var(--radius-lg);
      padding: 11px 12px;
      font: inherit;
      color: var(--ink);
      background: #ffffff;
      line-height: 1.62;
      outline: none;
      resize: vertical;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    textarea::placeholder {
      color: #97a0b9;
    }

    textarea:focus {
      border-color: #e55aa8;
      box-shadow: 0 0 0 4px rgba(236, 79, 160, 0.16);
    }

    #passageInput {
      min-height: 200px;
    }

    #wordInput {
      min-height: 84px;
    }

    .chips {
      margin-top: 9px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 28px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: #5a2f75;
      background: #fbefff;
      border: 1px solid #eecdfb;
    }

    .chip.dim {
      color: #8088a4;
      background: #f5f7fd;
      border: 1px dashed #d7deef;
    }

    .quick {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick button {
      border: 1px solid #d8deef;
      border-radius: var(--radius-md);
      background: #f8f9ff;
      color: #3a4767;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 8px 11px;
      cursor: pointer;
    }

    .quick button:hover {
      background: #f1f4ff;
    }

    .action-bar {
      margin-top: 12px;
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.2s ease;
      min-height: 44px;
      padding: 11px 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn[disabled] {
      opacity: 0.52;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn.primary {
      flex: 1;
      min-width: 200px;
      color: #fff;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-strong) 100%);
      box-shadow: 0 9px 18px rgba(214, 63, 143, 0.26);
    }

    .btn.secondary {
      min-width: 185px;
      color: #3b4664;
      background: #eff2fb;
      border: 1px solid #d6deef;
    }

    .loader {
      display: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.56);
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }

    .btn.loading .loader {
      display: inline-block;
    }

    .status {
      margin-top: 12px;
      min-height: 42px;
      border-radius: 10px;
      border: 1px solid #d9dfef;
      padding: 10px;
      display: flex;
      align-items: center;
      background: #f7f9ff;
      color: #4a5676;
      font-size: 0.88rem;
    }

    .status.pending {
      background: #fff6e9;
      border-color: #ffdfaa;
      color: #916628;
      font-weight: 700;
    }

    .status.success {
      background: #ecfff6;
      border-color: #b8ecd6;
      color: var(--success);
      font-weight: 700;
    }

    .status.error {
      background: #fff1f3;
      border-color: #f5c4cb;
      color: var(--danger);
      font-weight: 700;
    }

    .hint {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #727c99;
      line-height: 1.52;
    }

    .mono {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.74rem;
      color: #7882a4;
    }

    .preview {
      padding: 15px;
    }

    .preview-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 10px;
    }

    .preview-title {
      margin: 0;
      font-family: "Baloo 2", "M PLUS Rounded 1c", sans-serif;
      font-size: 1.03rem;
    }

    .table-wrap {
      border: 1px solid #dce2f1;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      text-align: left;
      font-size: 0.75rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #4a5676;
      background: #f7f9ff;
      padding: 10px 11px;
      border-bottom: 1px solid #e2e7f6;
    }

    tbody td {
      vertical-align: top;
      padding: 10px 11px;
      border-bottom: 1px solid #edf1fa;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #2f3a57;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .col-front,
    .col-back {
      width: 50%;
    }

    .col-back {
      white-space: pre-wrap;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 10px 10px 22px;
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .panel,
      .preview,
      .hero {
        border-radius: 16px;
      }

      textarea {
        font-size: 16px;
      }

      #passageInput {
        min-height: 170px;
      }

      #wordInput {
        min-height: 100px;
      }

      .quick button {
        min-height: 44px;
      }

      .action-bar {
        position: sticky;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
        z-index: 4;
        background: rgba(255, 255, 255, 0.97);
        border: 1px solid #dbe2f2;
        border-radius: 12px;
        padding: 8px;
      }

      .action-bar .btn {
        width: 100%;
        min-height: 50px;
      }

      thead {
        display: none;
      }

      table,
      tbody,
      tr,
      td {
        display: block;
        width: 100%;
      }

      tbody td {
        border-bottom: none;
        padding: 8px 10px;
      }

      tbody tr {
        border-bottom: 1px solid #e6ebf7;
        padding: 8px 0;
      }

      tbody tr:last-child {
        border-bottom: none;
      }

      tbody td:first-child::before,
      tbody td:last-child::before {
        display: block;
        font-size: 0.73rem;
        color: #7480a1;
        margin-bottom: 4px;
      }

      tbody td:first-child::before {
        content: "抜粋文";
      }

      tbody td:last-child::before {
        content: "意味・日本語訳";
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="card hero">
      <section>
        <p class="tag">CSV Creator Tool</p>
        <h1>Recappy Review</h1>
        <p>
          長文と分からなかった単語から、Anki向けのCSVを作成します。
          そのCSVファイルをAnkiにインポートすると、簡単にオリジナル単語帳ができます。
        </p>
      </section>

      <figure class="character">
        <img id="characterImage" src="CSVキャラクター.png" alt="CSVツールのキャラクター" />
        <figcaption id="characterCaption">リキャッピー</figcaption>
      </figure>
    </header>

    <section class="card panel">
      <h2>入力</h2>
      <p class="panel-sub">長文を貼り付けて、分からなかった単語を入力してください。</p>

      <div class="field">
        <div class="field-head">
          <label class="field-label" for="passageInput"><span class="step">1</span>長文をコピペ</label>
        </div>
        <textarea id="passageInput" placeholder="ここに長文を貼り付けてください"></textarea>
      </div>

      <div class="field">
        <div class="field-head">
          <label class="field-label" for="wordInput"><span class="step">2</span>分からなかった単語</label>
        </div>
        <textarea id="wordInput" placeholder="改行・カンマ区切りで入力（例: crucial, infer, nuance）"></textarea>
        <div id="wordChips" class="chips" aria-live="polite"></div>
      </div>

      <div class="quick">
        <button id="clearBtn" type="button">全クリア</button>
      </div>

      <div class="action-bar">
        <button id="generateBtn" class="btn primary" type="button">
          <span class="loader" aria-hidden="true"></span>
          <span id="generateLabel">CSVを作成</span>
        </button>
        <button id="downloadBtn" class="btn secondary" type="button" disabled>CSVをダウンロード</button>
      </div>

      <p id="statusText" class="status" aria-live="polite">入力後に「CSVを作成」を押してください。</p>
      <p class="hint">
        <span class="mono">形式: (分からなかった単語数)行 x 2列</span><br />
        1列目: 抜粋文（単語を赤字+下線） / 2列目: 単語の意味 + 日本語訳
      </p>
    </section>

    <section id="previewSection" class="card preview" hidden>
      <div class="preview-head">
        <h2 class="preview-title">プレビュー</h2>
        <span id="rowCount" class="mono">0 rows</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-front">1列目: 抜粋文（Anki表）</th>
              <th class="col-back">2列目: 単語の意味・日本語訳（Anki裏）</th>
            </tr>
          </thead>
          <tbody id="previewBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const HIGHLIGHT_OPEN = "__HL_OPEN__";
    const HIGHLIGHT_CLOSE = "__HL_CLOSE__";
    const HIGHLIGHT_STYLE = "color:#c1121f;text-decoration:underline;font-weight:700;";

    const passageInput = document.getElementById("passageInput");
    const wordInput = document.getElementById("wordInput");
    const generateBtn = document.getElementById("generateBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const generateLabel = document.getElementById("generateLabel");
    const clearBtn = document.getElementById("clearBtn");

    const statusText = document.getElementById("statusText");
    const previewSection = document.getElementById("previewSection");
    const previewBody = document.getElementById("previewBody");
    const rowCount = document.getElementById("rowCount");
    const wordChips = document.getElementById("wordChips");

    const characterImage = document.getElementById("characterImage");
    const characterCaption = document.getElementById("characterCaption");

    const state = {
      rows: [],
      csvContent: "",
      downloadName: "",
      isGenerating: false
    };

    const translationCache = new Map();
    const dictionaryCache = new Map();

    function setStatus(message, type = "info") {
      statusText.textContent = message;
      statusText.className = `status ${type}`;
    }

    function setGeneratingState(isLoading) {
      state.isGenerating = isLoading;
      generateBtn.disabled = isLoading;
      generateBtn.classList.toggle("loading", isLoading);
      generateLabel.textContent = isLoading ? "生成中..." : "CSVを作成";
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeRegex(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function toWordList(text) {
      const normalized = text
        .split(/[\n,、;]/)
        .map((word) => word.trim())
        .filter((word) => word.length > 0);

      const unique = [];
      const seen = new Set();

      for (const word of normalized) {
        const key = word.toLowerCase();
        if (seen.has(key)) {
          continue;
        }
        seen.add(key);
        unique.push(word);
      }

      return unique;
    }

    function splitSentences(text) {
      const cleaned = text.replace(/\r/g, "");
      const lines = cleaned.split(/\n+/).map((line) => line.trim()).filter(Boolean);
      const sentences = [];

      for (const line of lines) {
        const parts = line.match(/[^.!?]+[.!?]?/g) || [line];
        for (const part of parts) {
          const trimmed = part.trim();
          if (trimmed) {
            sentences.push(trimmed);
          }
        }
      }

      if (sentences.length === 0 && cleaned.trim()) {
        sentences.push(cleaned.trim());
      }

      return sentences;
    }

    function buildWordPattern(word) {
      const normalized = word.trim();
      const phrasePattern = normalized.split(/\s+/).map(escapeRegex).join("\\s+");
      const hasSpace = /\s/.test(normalized);
      if (hasSpace) {
        return phrasePattern;
      }
      return `${phrasePattern}(?:s|es|ed|ing|d|er|est)?`;
    }

    function findSentenceForWord(sentences, word) {
      const pattern = buildWordPattern(word);
      const strictRegex = new RegExp(`\\b${pattern}\\b`, "i");
      const strict = sentences.find((sentence) => strictRegex.test(sentence));
      if (strict) {
        return strict;
      }

      const looseRegex = new RegExp(pattern, "i");
      return sentences.find((sentence) => looseRegex.test(sentence)) || "";
    }

    function highlightWord(sentence, word) {
      if (!sentence) {
        return "";
      }

      const pattern = buildWordPattern(word);
      const strictRegex = new RegExp(`\\b(${pattern})\\b`, "ig");
      let marked = sentence;

      if (strictRegex.test(sentence)) {
        strictRegex.lastIndex = 0;
        marked = sentence.replace(strictRegex, `${HIGHLIGHT_OPEN}$1${HIGHLIGHT_CLOSE}`);
      } else {
        const looseRegex = new RegExp(`(${pattern})`, "i");
        marked = sentence.replace(looseRegex, `${HIGHLIGHT_OPEN}$1${HIGHLIGHT_CLOSE}`);
      }

      return escapeHtml(marked)
        .replaceAll(HIGHLIGHT_OPEN, `<span style="${HIGHLIGHT_STYLE}">`)
        .replaceAll(HIGHLIGHT_CLOSE, "</span>");
    }

    function csvEscape(value) {
      return `"${String(value).replace(/"/g, '""')}"`;
    }

    function buildCsv(rows) {
      const lines = rows.map((row) => `${csvEscape(row.frontHtml)},${csvEscape(row.backText)}`);
      return `\uFEFF${lines.join("\n")}`;
    }

    function formatDate() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function clip(text, limit = 70) {
      if (text.length <= limit) {
        return text;
      }
      return `${text.slice(0, limit - 1)}…`;
    }

    function toJapanesePartOfSpeech(partOfSpeech) {
      const map = {
        noun: "名詞",
        verb: "動詞",
        adjective: "形容詞",
        adverb: "副詞",
        pronoun: "代名詞",
        preposition: "前置詞",
        conjunction: "接続詞",
        interjection: "間投詞",
        article: "冠詞",
        determiner: "限定詞"
      };
      const key = String(partOfSpeech || "").toLowerCase();
      return map[key] || "";
    }

    function renderWordChips(words) {
      if (!words.length) {
        wordChips.innerHTML = '<span class="chip dim">単語を入力するとここに表示されます</span>';
        return;
      }

      wordChips.innerHTML = words.map((word) => `<span class="chip">${escapeHtml(word)}</span>`).join("");
    }

    function updateUIState() {
      const words = toWordList(wordInput.value);
      renderWordChips(words);
    }

    async function translateViaGoogle(text) {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ja&dt=t&q=${encodeURIComponent(text)}`;
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Google Translate HTTP ${response.status}`);
      }

      const data = await response.json();
      const chunks = Array.isArray(data) ? data[0] : null;
      if (!Array.isArray(chunks)) {
        throw new Error("Google Translate のレスポンス形式が不正です");
      }

      return chunks.map((chunk) => chunk[0]).join("").trim();
    }

    async function translateViaMyMemory(text) {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ja`;
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`MyMemory HTTP ${response.status}`);
      }

      const data = await response.json();
      const translated = data?.responseData?.translatedText;
      if (!translated) {
        throw new Error("MyMemory の翻訳取得に失敗しました");
      }
      return translated.trim();
    }

    async function translateToJapanese(text) {
      const key = text.trim();
      if (!key) {
        return "";
      }

      if (translationCache.has(key)) {
        return translationCache.get(key);
      }

      const translators = [translateViaGoogle, translateViaMyMemory];

      for (const translator of translators) {
        try {
          const translated = await translator(key);
          if (translated) {
            translationCache.set(key, translated);
            return translated;
          }
        } catch (_) {
          // fall through
        }
      }

      translationCache.set(key, "");
      return "";
    }

    async function fetchDictionaryMeaning(word) {
      const key = word.toLowerCase();
      if (dictionaryCache.has(key)) {
        return dictionaryCache.get(key);
      }

      const fallback = { partOfSpeech: "", definition: "" };

      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(key)}`);
        if (!response.ok) {
          dictionaryCache.set(key, fallback);
          return fallback;
        }

        const data = await response.json();
        if (!Array.isArray(data) || data.length === 0) {
          dictionaryCache.set(key, fallback);
          return fallback;
        }

        const meaning = data[0]?.meanings?.[0];
        const definition = meaning?.definitions?.[0]?.definition || "";
        const partOfSpeech = meaning?.partOfSpeech || "";

        const result = { partOfSpeech, definition };
        dictionaryCache.set(key, result);
        return result;
      } catch (_) {
        dictionaryCache.set(key, fallback);
        return fallback;
      }
    }

    async function buildRow(word, sentences) {
      const matchedSentence = findSentenceForWord(sentences, word);
      const frontBaseSentence = matchedSentence || `No sentence found for "${word}".`;
      const frontHtml = highlightWord(frontBaseSentence, word);

      const [wordJa, dict, sentenceJa] = await Promise.all([
        translateToJapanese(word),
        fetchDictionaryMeaning(word),
        matchedSentence ? translateToJapanese(matchedSentence) : Promise.resolve("")
      ]);

      const meaningText = wordJa || "意味の取得に失敗";
      const posJa = toJapanesePartOfSpeech(dict.partOfSpeech);

      const meaningLine = posJa
        ? `${meaningText}（${posJa}）`
        : meaningText;

      let sentenceLine = "";
      if (sentenceJa) {
        sentenceLine = sentenceJa;
      } else if (matchedSentence) {
        sentenceLine = "（日本語訳の取得に失敗しました）";
      } else {
        sentenceLine = "（本文に一致する文が見つかりませんでした）";
      }

      const backText = `【単語の意味】${clip(meaningLine, 110)}\n【日本語訳】${clip(sentenceLine, 160)}`;

      return {
        word,
        frontHtml,
        backText
      };
    }

    function renderPreview(rows) {
      if (!rows.length) {
        previewBody.innerHTML = "";
        previewSection.hidden = true;
        rowCount.textContent = "0 rows";
        return;
      }

      const html = rows
        .map(
          (row) => `
            <tr>
              <td class="col-front">${row.frontHtml}</td>
              <td class="col-back">${escapeHtml(row.backText).replace(/\n/g, "<br>")}</td>
            </tr>
          `
        )
        .join("");

      previewBody.innerHTML = html;
      rowCount.textContent = `${rows.length} rows`;
      previewSection.hidden = false;
    }

    function clearAllInputs() {
      passageInput.value = "";
      wordInput.value = "";
      state.rows = [];
      state.csvContent = "";
      state.downloadName = "";
      downloadBtn.disabled = true;
      renderPreview([]);
      setStatus("入力内容をクリアしました。", "info");
      updateUIState();
    }

    async function handleGenerate() {
      if (state.isGenerating) {
        return;
      }

      const passage = passageInput.value.trim();
      const words = toWordList(wordInput.value);

      if (!passage) {
        setStatus("長文を入力してください。", "error");
        return;
      }

      if (!words.length) {
        setStatus("分からなかった単語を1つ以上入力してください。", "error");
        return;
      }

      setGeneratingState(true);
      downloadBtn.disabled = true;
      setStatus("CSVを生成しています...", "pending");

      try {
        const sentences = splitSentences(passage);
        const rows = [];

        for (let i = 0; i < words.length; i += 1) {
          setStatus(`処理中 ${i + 1}/${words.length}: ${words[i]}`, "pending");
          const row = await buildRow(words[i], sentences);
          rows.push(row);
        }

        state.rows = rows;
        state.csvContent = buildCsv(rows);
        state.downloadName = `nativecamp_review_${formatDate()}.csv`;

        renderPreview(rows);
        downloadBtn.disabled = rows.length === 0;
        setStatus(`生成完了: ${rows.length} 行のCSVを作成しました。`, "success");
      } catch (error) {
        console.error(error);
        setStatus(`生成に失敗しました: ${error.message}`, "error");
      } finally {
        setGeneratingState(false);
      }
    }

    function handleDownload() {
      if (!state.csvContent) {
        setStatus("先にCSVを作成してください。", "error");
        return;
      }

      const blob = new Blob([state.csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");

      anchor.href = url;
      anchor.download = state.downloadName || `nativecamp_review_${formatDate()}.csv`;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);

      setStatus("CSVをダウンロードしました。Anki取り込み時はHTMLを有効にしてください。", "success");
    }

    characterImage.addEventListener("error", () => {
      characterImage.style.display = "none";
      characterCaption.textContent = "CSVキャラクター.png を同じフォルダに置くと表示されます";
    });

    passageInput.addEventListener("input", updateUIState);
    wordInput.addEventListener("input", updateUIState);
    generateBtn.addEventListener("click", handleGenerate);
    downloadBtn.addEventListener("click", handleDownload);
    clearBtn.addEventListener("click", clearAllInputs);

    updateUIState();
    renderPreview([]);
  </script>
</body>
</html>
