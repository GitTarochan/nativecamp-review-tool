<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NativeCamp復習ツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --paper: #fffdf4;
      --line: #d6deeb;
      --ink: #1f2937;
      --muted: #4b5563;
      --border: #c9d2e5;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --danger: #c1121f;
      --button-gray: #e5e7eb;
      --button-gray-ink: #374151;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(to bottom, rgba(214, 222, 235, 0.35) 1px, transparent 1px) 0 0 / 100% 34px,
        radial-gradient(circle at 20% 15%, #f3f7ff 0%, #eef5ff 28%, #f8fbff 100%);
      min-height: 100vh;
      padding: 28px 16px 40px;
    }

    .wrap {
      width: min(980px, 100%);
      margin: 0 auto;
    }

    .card {
      background: color-mix(in srgb, var(--paper) 90%, white);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 22px 36px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.35rem, 2.8vw, 1.8rem);
      letter-spacing: 0.02em;
    }

    .sub {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .field {
      margin-top: 14px;
    }

    .field label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .step {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      font-size: 0.75rem;
      background: #dbeafe;
      color: #1d4ed8;
      font-family: "IBM Plex Mono", monospace;
    }

    textarea {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 12px;
      font: inherit;
      color: var(--ink);
      background: #fff;
      padding: 12px 14px;
      outline: none;
      resize: vertical;
      line-height: 1.65;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
    }

    #passageInput {
      min-height: 220px;
    }

    #wordInput {
      min-height: 84px;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      padding: 12px 18px;
      cursor: pointer;
      transition: transform 0.16s ease, opacity 0.16s ease, box-shadow 0.2s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    #generateBtn {
      background: linear-gradient(135deg, var(--accent) 0%, #14b8a6 100%);
      color: white;
      min-width: 190px;
      box-shadow: 0 8px 16px rgba(15, 118, 110, 0.25);
    }

    #downloadBtn {
      background: var(--button-gray);
      color: var(--button-gray-ink);
      min-width: 174px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status {
      min-height: 24px;
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
      font-weight: 700;
    }

    .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .preview {
      margin-top: 22px;
      border-top: 2px dashed var(--border);
      padding-top: 16px;
    }

    .preview-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 10px;
    }

    .preview-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: white;
    }

    thead th {
      text-align: left;
      font-size: 0.79rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #334155;
      background: #f8fafc;
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    tbody td {
      vertical-align: top;
      padding: 10px 12px;
      border-bottom: 1px solid #eef2f7;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .col-front {
      width: 50%;
    }

    .col-back {
      width: 50%;
      white-space: pre-wrap;
    }

    .mono {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      color: #475569;
    }

    @media (max-width: 768px) {
      .card {
        padding: 16px;
      }

      #generateBtn,
      #downloadBtn {
        width: 100%;
      }

      thead {
        display: none;
      }

      table,
      tbody,
      tr,
      td {
        display: block;
        width: 100%;
      }

      tbody td {
        border-bottom: none;
        padding: 8px 10px;
      }

      tbody tr {
        border-bottom: 1px solid #e5e7eb;
        padding: 8px 0;
      }

      tbody tr:last-child {
        border-bottom: none;
      }

      tbody td:first-child::before {
        content: "抜粋文";
        display: block;
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 4px;
      }

      tbody td:last-child::before {
        content: "日本語訳・解説";
        display: block;
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 4px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>NativeCamp 英語復習ツール</h1>
      <p class="sub">長文と分からなかった単語を入れるだけで、Anki用CSV（2列）を作成できます。</p>

      <div class="field">
        <label for="passageInput"><span class="step">1</span>長文をコピペ</label>
        <textarea id="passageInput" placeholder="ここに長文を貼り付けてください"></textarea>
      </div>

      <div class="field">
        <label for="wordInput"><span class="step">2</span>分からなかった単語を入力</label>
        <textarea id="wordInput" placeholder="改行・カンマ区切りで入力（例: crucial, accurate, hesitation）"></textarea>
      </div>

      <div class="actions">
        <button id="generateBtn" type="button">CSVを作成</button>
        <button id="downloadBtn" type="button" disabled>完成CSVをダウンロード</button>
      </div>

      <p id="statusText" class="status" aria-live="polite"></p>
      <p class="hint">
        形式: <span class="mono">(分からなかった単語数)行 x 2列</span>。<br />
        1列目: 該当文（単語を赤字+下線で強調） / 2列目: 日本語訳 + シンプル解説（2行以内）。
      </p>

      <section id="previewSection" class="preview" hidden>
        <div class="preview-head">
          <h2 class="preview-title">プレビュー</h2>
          <span id="rowCount" class="mono">0 rows</span>
        </div>
        <table>
          <thead>
            <tr>
              <th class="col-front">1列目: 抜粋文（Anki表）</th>
              <th class="col-back">2列目: 日本語訳と解説（Anki裏）</th>
            </tr>
          </thead>
          <tbody id="previewBody"></tbody>
        </table>
      </section>
    </section>
  </main>

  <script>
    const HIGHLIGHT_OPEN = "__HL_OPEN__";
    const HIGHLIGHT_CLOSE = "__HL_CLOSE__";
    const HIGHLIGHT_STYLE = "color:#c1121f;text-decoration:underline;font-weight:700;";

    const passageInput = document.getElementById("passageInput");
    const wordInput = document.getElementById("wordInput");
    const generateBtn = document.getElementById("generateBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusText = document.getElementById("statusText");
    const previewSection = document.getElementById("previewSection");
    const previewBody = document.getElementById("previewBody");
    const rowCount = document.getElementById("rowCount");

    const state = {
      rows: [],
      csvContent: "",
      downloadName: "",
      isGenerating: false
    };

    const translationCache = new Map();
    const dictionaryCache = new Map();

    function setStatus(message, type = "info") {
      statusText.textContent = message;
      statusText.className = type === "error" ? "status error" : "status";
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeRegex(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function toWordList(text) {
      return text
        .split(/[\n,、;]/)
        .map((word) => word.trim())
        .filter((word) => word.length > 0);
    }

    function splitSentences(text) {
      const cleaned = text.replace(/\r/g, "");
      const lines = cleaned.split(/\n+/).map((line) => line.trim()).filter(Boolean);
      const sentences = [];

      for (const line of lines) {
        const parts = line.match(/[^.!?]+[.!?]?/g) || [line];
        for (const part of parts) {
          const trimmed = part.trim();
          if (trimmed) {
            sentences.push(trimmed);
          }
        }
      }

      if (sentences.length === 0 && cleaned.trim()) {
        sentences.push(cleaned.trim());
      }

      return sentences;
    }

    function buildWordPattern(word) {
      const normalized = word.trim();
      const phrasePattern = normalized.split(/\s+/).map(escapeRegex).join("\\s+");
      const hasSpace = /\s/.test(normalized);
      if (hasSpace) {
        return phrasePattern;
      }
      return `${phrasePattern}(?:s|es|ed|ing|d|er|est)?`;
    }

    function findSentenceForWord(sentences, word) {
      const pattern = buildWordPattern(word);
      const strictRegex = new RegExp(`\\b${pattern}\\b`, "i");
      const strict = sentences.find((sentence) => strictRegex.test(sentence));
      if (strict) {
        return strict;
      }

      const looseRegex = new RegExp(pattern, "i");
      return sentences.find((sentence) => looseRegex.test(sentence)) || "";
    }

    function highlightWord(sentence, word) {
      if (!sentence) {
        return "";
      }

      const pattern = buildWordPattern(word);
      const strictRegex = new RegExp(`\\b(${pattern})\\b`, "ig");
      let marked = sentence;

      if (strictRegex.test(sentence)) {
        strictRegex.lastIndex = 0;
        marked = sentence.replace(strictRegex, `${HIGHLIGHT_OPEN}$1${HIGHLIGHT_CLOSE}`);
      } else {
        const looseRegex = new RegExp(`(${pattern})`, "i");
        marked = sentence.replace(looseRegex, `${HIGHLIGHT_OPEN}$1${HIGHLIGHT_CLOSE}`);
      }

      return escapeHtml(marked)
        .replaceAll(HIGHLIGHT_OPEN, `<span style="${HIGHLIGHT_STYLE}">`)
        .replaceAll(HIGHLIGHT_CLOSE, "</span>");
    }

    function csvEscape(value) {
      return `"${String(value).replace(/"/g, '""')}"`;
    }

    function buildCsv(rows) {
      const lines = rows.map((row) => `${csvEscape(row.frontHtml)},${csvEscape(row.backText)}`);
      return `\uFEFF${lines.join("\n")}`;
    }

    function formatDate() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function clip(text, limit = 70) {
      if (text.length <= limit) {
        return text;
      }
      return `${text.slice(0, limit - 1)}…`;
    }

    async function translateViaGoogle(text) {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ja&dt=t&q=${encodeURIComponent(text)}`;
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Google Translate HTTP ${response.status}`);
      }

      const data = await response.json();
      const chunks = Array.isArray(data) ? data[0] : null;
      if (!Array.isArray(chunks)) {
        throw new Error("Google Translate のレスポンス形式が不正です");
      }

      return chunks.map((chunk) => chunk[0]).join("").trim();
    }

    async function translateViaMyMemory(text) {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ja`;
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`MyMemory HTTP ${response.status}`);
      }

      const data = await response.json();
      const translated = data?.responseData?.translatedText;
      if (!translated) {
        throw new Error("MyMemory の翻訳取得に失敗しました");
      }
      return translated.trim();
    }

    async function translateToJapanese(text) {
      const key = text.trim();
      if (!key) {
        return "";
      }

      if (translationCache.has(key)) {
        return translationCache.get(key);
      }

      const translators = [translateViaGoogle, translateViaMyMemory];

      for (const translator of translators) {
        try {
          const translated = await translator(key);
          if (translated) {
            translationCache.set(key, translated);
            return translated;
          }
        } catch (_) {
          // fall through
        }
      }

      translationCache.set(key, "");
      return "";
    }

    async function fetchDictionaryMeaning(word) {
      const key = word.toLowerCase();
      if (dictionaryCache.has(key)) {
        return dictionaryCache.get(key);
      }

      const fallback = { partOfSpeech: "", definition: "" };

      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(key)}`);
        if (!response.ok) {
          dictionaryCache.set(key, fallback);
          return fallback;
        }

        const data = await response.json();
        if (!Array.isArray(data) || data.length === 0) {
          dictionaryCache.set(key, fallback);
          return fallback;
        }

        const meaning = data[0]?.meanings?.[0];
        const definition = meaning?.definitions?.[0]?.definition || "";
        const partOfSpeech = meaning?.partOfSpeech || "";

        const result = { partOfSpeech, definition };
        dictionaryCache.set(key, result);
        return result;
      } catch (_) {
        dictionaryCache.set(key, fallback);
        return fallback;
      }
    }

    async function buildRow(word, sentences) {
      const matchedSentence = findSentenceForWord(sentences, word);
      const frontBaseSentence = matchedSentence || `No sentence found for "${word}".`;
      const frontHtml = highlightWord(frontBaseSentence, word);

      const [sentenceJa, wordJa, dict] = await Promise.all([
        matchedSentence ? translateToJapanese(matchedSentence) : Promise.resolve(""),
        translateToJapanese(word),
        fetchDictionaryMeaning(word)
      ]);

      const definitionJa = dict.definition ? await translateToJapanese(dict.definition) : "";
      const translatedSentence = sentenceJa || "（日本語訳を取得できませんでした）";

      const meaningText = wordJa || "意味取得中";
      const explanationLine1 = dict.partOfSpeech
        ? `${word} は ${dict.partOfSpeech} で「${meaningText}」を表します。`
        : `${word} は「${meaningText}」を表す語です。`;

      let explanationLine2 = "";
      if (definitionJa) {
        explanationLine2 = `この文脈では「${clip(definitionJa, 46)}」のニュアンスです。`;
      } else if (matchedSentence) {
        explanationLine2 = `この文では「${clip(translatedSentence, 46)}」という流れで使われています。`;
      } else {
        explanationLine2 = "本文に一致する文が見つからなかったため、綴りを確認してください。";
      }

      const explanation = `${clip(explanationLine1, 78)}\n${clip(explanationLine2, 78)}`;
      const backText = `【日本語訳】${translatedSentence}\n【解説】${explanation}`;

      return {
        word,
        frontHtml,
        backText
      };
    }

    function renderPreview(rows) {
      if (!rows.length) {
        previewBody.innerHTML = "";
        previewSection.hidden = true;
        rowCount.textContent = "0 rows";
        return;
      }

      const html = rows
        .map(
          (row) => `
            <tr>
              <td class="col-front">${row.frontHtml}</td>
              <td class="col-back">${escapeHtml(row.backText).replace(/\n/g, "<br>")}</td>
            </tr>
          `
        )
        .join("");

      previewBody.innerHTML = html;
      rowCount.textContent = `${rows.length} rows`;
      previewSection.hidden = false;
    }

    async function handleGenerate() {
      if (state.isGenerating) {
        return;
      }

      const passage = passageInput.value.trim();
      const words = toWordList(wordInput.value);

      if (!passage) {
        setStatus("長文を入力してください。", "error");
        return;
      }

      if (!words.length) {
        setStatus("分からなかった単語を1つ以上入力してください。", "error");
        return;
      }

      state.isGenerating = true;
      generateBtn.disabled = true;
      downloadBtn.disabled = true;
      setStatus("CSVを生成しています...");

      try {
        const sentences = splitSentences(passage);
        const rows = [];

        for (let i = 0; i < words.length; i += 1) {
          setStatus(`処理中 ${i + 1}/${words.length}: ${words[i]}`);
          const row = await buildRow(words[i], sentences);
          rows.push(row);
        }

        state.rows = rows;
        state.csvContent = buildCsv(rows);
        state.downloadName = `nativecamp_review_${formatDate()}.csv`;

        renderPreview(rows);
        downloadBtn.disabled = rows.length === 0;
        setStatus(`生成完了: ${rows.length} 行のCSVを作成しました。`);
      } catch (error) {
        console.error(error);
        setStatus(`生成に失敗しました: ${error.message}`, "error");
      } finally {
        state.isGenerating = false;
        generateBtn.disabled = false;
      }
    }

    function handleDownload() {
      if (!state.csvContent) {
        setStatus("先にCSVを作成してください。", "error");
        return;
      }

      const blob = new Blob([state.csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");

      anchor.href = url;
      anchor.download = state.downloadName || `nativecamp_review_${formatDate()}.csv`;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);

      setStatus("CSVをダウンロードしました。Anki取り込み時はHTMLを有効にしてください。");
    }

    generateBtn.addEventListener("click", handleGenerate);
    downloadBtn.addEventListener("click", handleDownload);
  </script>
</body>
</html>
